name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test LIRC parser and waveform generation
        run: tests/run_lircd_host_tests.sh
      - name: Validate OpenAPI document
        run: python3 -m json.tool main/web/openapi.json >/dev/null

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3 firmware
        run: /opt/esp/entrypoint.sh idf.py set-target esp32s3 build
